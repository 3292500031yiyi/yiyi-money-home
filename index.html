<style>
:root{--bg:#fff8fb;--card:#ffffffee;--text:#392f35;--muted:#94838d;--line:#f0e2e9;--pink:#ec8fb4;--pink2:#d96999;--green:#68a67c;--red:#d96d75;--gold:#c58b38;--shadow:0 14px 38px rgba(91,59,77,.09)}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 8% 0,#ffdce988,transparent 28%),radial-gradient(circle at 96% 4%,#e7dcff99,transparent 26%),linear-gradient(180deg,#fff9fc,#fffdfb);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:560px;margin:auto;padding:16px 12px calc(46px + env(safe-area-inset-bottom))}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 12px}.brand h1{font-size:27px;letter-spacing:-1px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:4px 0 0}.month{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px;box-shadow:var(--shadow)}.month input{border:0;background:transparent;outline:0;width:120px;color:var(--text)}.card{background:var(--card);border:1px solid #fff;border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}.goalCard{padding:16px;margin-bottom:13px}.goalHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.goalTitle{font-size:13px;color:var(--muted);font-weight:700}.plus{width:38px;height:38px;border:0;border-radius:50%;background:#fff;color:var(--pink2);font-size:24px;line-height:1;border:1px solid var(--line);box-shadow:0 7px 18px #c9769820}.goalMain{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.goalBox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px}.goalBox span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.goalBox b{font-size:22px;letter-spacing:-.5px}.goalBox small{display:block;font-size:11px;color:var(--muted);margin-top:3px}.progress{height:8px;background:#f5edf1;border-radius:99px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--pink),var(--pink2));width:0}.progress.green i{background:linear-gradient(90deg,#8ec39e,#5fa276)}.goalNote{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}.bigAddWrap{display:flex;justify-content:center;margin:15px 0}.bigAdd{border:0;border-radius:999px;padding:14px 28px;color:#fff;font-weight:900;font-size:17px;background:linear-gradient(135deg,var(--pink),var(--pink2));box-shadow:0 12px 28px #d96f9938}.section{padding:14px;margin-top:12px}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.sectionHead h2{font-size:17px;margin:0}.miniBtn{border:0;background:transparent;color:var(--pink2);font-weight:800;padding:5px}details{background:#fff;border:1px solid var(--line);border-radius:16px;margin-top:8px;overflow:hidden}summary{list-style:none;cursor:pointer}summary::-webkit-details-marker{display:none}.jarSummary,.daySummary{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;padding:12px}.jarEmoji{font-size:21px}.jarName,.dayDate{font-weight:800;font-size:14px}.jarSub,.daySub{font-size:11px;color:var(--muted);margin-top:2px}.jarAmount,.dayAmount{text-align:right;font-weight:900;font-size:14px}.chev{font-size:11px;color:var(--muted);margin-left:4px}.jarMiniBar{height:5px;background:#f4edf1;border-radius:99px;overflow:hidden;margin-top:5px}.jarMiniBar i{display:block;height:100%;background:linear-gradient(90deg,#8fc5a0,#5fa276)}.detailBody{border-top:1px solid var(--line);padding:11px 12px 12px;font-size:12px;color:var(--muted)}.detailRow{display:flex;justify-content:space-between;gap:12px;margin:5px 0}.dangerLink{border:0;background:transparent;color:var(--red);padding:4px 0}.tx{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}.tx:last-child{border-bottom:0}.txIcon{width:32px;height:32px;border-radius:10px;background:#fff4f8;display:grid;place-items:center}.txTitle{font-size:13px;font-weight:800}.txMeta{font-size:10px;color:var(--muted);margin-top:2px}.txAmt{font-size:13px;font-weight:900;text-align:right}.expense{color:var(--red)}.income{color:var(--green)}.save{color:var(--pink2)}.empty{padding:18px;text-align:center;color:var(--muted);font-size:12px}.awardLine{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px 2px}.awardText b{display:block;font-size:14px}.awardText span{font-size:11px;color:var(--muted)}.awardBadge{padding:6px 9px;border-radius:999px;background:#fff3f8;color:var(--pink2);font-size:11px;font-weight:800}.awardBadge.ok{background:#edf7ef;color:#4e7c5b}.backup summary{padding:12px;font-size:13px;font-weight:800}.backupInner{padding:0 12px 12px;border-top:1px solid var(--line)}.btnRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.softBtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;color:var(--text);font-weight:700}.footer{font-size:10px;color:var(--muted);text-align:center;margin-top:12px}.sheet{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;background:#4d344142;backdrop-filter:blur(5px);z-index:50;padding:0}.sheet.show{display:flex}.panel{width:min(560px,100%);background:#fff;border-radius:24px 24px 0 0;padding:15px 15px calc(17px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px #50334230;max-height:88vh;overflow:auto}.handle{width:44px;height:5px;background:#eadde4;border-radius:99px;margin:0 auto 12px}.panelHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.panelHead h3{margin:0;font-size:19px}.close{width:34px;height:34px;border:0;border-radius:50%;background:#f8f1f5;color:var(--muted);font-size:19px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:11px;color:var(--muted);font-weight:800}input,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px 12px;color:var(--text);outline:0}input:focus,select:focus{border-color:var(--pink2);box-shadow:0 0 0 3px #d96f9916}.primary{width:100%;border:0;border-radius:14px;padding:12px 14px;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;font-weight:900;margin-top:12px}.segment{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:13px}.segment button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 6px;color:var(--muted);font-weight:800}.segment button.active{background:#fff0f6;border-color:#f0bdd1;color:var(--pink2)}.cheer{position:fixed;inset:0;display:none;place-items:center;background:#4d34413d;backdrop-filter:blur(5px);z-index:80;padding:18px}.cheer.show{display:grid}.cheerCard{width:min(390px,100%);background:#fff;border-radius:24px;padding:24px 20px;text-align:center;box-shadow:0 24px 80px #49313d35}.cheerEmoji{font-size:42px}.cheerCard h3{font-size:20px;margin:10px 0 7px}.cheerCard p{font-size:14px;line-height:1.7;color:#6e5b66;margin:0}.cheerCard button{border:0;border-radius:999px;padding:10px 22px;background:#fff0f6;color:var(--pink2);font-weight:900;margin-top:16px}.cert{display:none;text-align:center;border:2px solid #e5c382;background:linear-gradient(145deg,#fff7df,#fff);border-radius:18px;padding:18px;margin-top:10px}.cert.show{display:block}.cert .seal{font-size:36px}.cert h3{font-family:Georgia,"Songti SC",serif;margin:7px 0}.cert p{font-size:12px;color:#775f49;line-height:1.6}@media(max-width:380px){.goalMain{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<main class="wrap">
<header class="topbar"><div class="brand"><h1>老婆的钱钱小窝 🐷</h1><p>今天也把钱钱放到该去的地方。</p></div><div class="month">📅 <input id="month" type="month"></div></header>
<section class="card goalCard"><div class="goalHead"><div><div class="goalTitle">本月目标</div><div id="goalHeadline" style="font-weight:900;margin-top:3px">还没设目标～</div></div><button class="plus" id="openGoal" aria-label="设置本月目标">＋</button></div><div class="goalMain"><div class="goalBox"><span>已经存下</span><b id="mSaved">¥0</b><small id="saveSmall">目标 ¥0</small><div class="progress green"><i id="saveBar"></i></div></div><div class="goalBox"><span>已经花掉</span><b id="mExpense">¥0</b><small id="spendSmall">上限 ¥0</small><div class="progress"><i id="spendBar"></i></div></div></div><div class="goalNote" id="goalNote">点右上角 ＋ 给这个月定一个舒服的目标。</div></section>
<div class="bigAddWrap"><button class="bigAdd" id="openEntry">＋ 记一笔</button></div>
<section class="card section"><div class="sectionHead"><h2>存钱罐</h2><button class="miniBtn" id="addJar">＋ 新建</button></div><div id="jarlist"></div></section>
<section class="card section"><div class="sectionHead"><h2>按日期看账</h2><span id="monthIncome" style="font-size:11px;color:var(--muted)">本月收入 ¥0</span></div><div id="daylist"></div></section>
<section class="card section"><div class="awardLine"><div class="awardText"><b>🏆 本月大奖状</b><span id="awardHint">完成目标以后解锁</span></div><button class="awardBadge" id="awardBtn">未解锁</button></div><div class="cert" id="certificate"><div class="seal">🏆</div><h3>月度存钱优秀奖</h3><div style="font-size:24px;font-weight:900;color:var(--gold)">颁给：老婆</div><p id="awardText">认真计划、认真生活，也认真照顾未来的自己。</p><button class="softBtn" onclick="window.print()">打印 / 保存奖状</button></div></section>
<details class="card section backup"><summary>数据与备份</summary><div class="backupInner"><div class="btnRow"><button class="softBtn" id="exportBtn">导出备份</button><label class="softBtn">导入备份<input id="importFile" type="file" accept="application/json" hidden></label></div></div></details><div class="footer">账目只保存在这台设备的浏览器里，不会跟着 GitHub 页面公开。</div>
</main>
<div class="sheet" id="goalSheet"><div class="panel"><div class="handle"></div><div class="panelHead"><h3>设置本月目标</h3><button class="close" data-close="goalSheet">×</button></div><div class="fields"><div class="field"><label>本月存钱目标</label><input id="goal" type="number" min="0" placeholder="例如 3000"></div><div class="field"><label>本月支出上限</label><input id="limit" type="number" min="0" placeholder="例如 2000"></div><div class="field full"><label>这个月想对自己说</label><input id="monthNote" maxlength="50" placeholder="先存后花，也要允许自己开心！"></div></div><button class="primary" id="saveGoal">保存目标</button></div></div>
<div class="sheet" id="entrySheet"><div class="panel"><div class="handle"></div><div class="panelHead"><h3>记一笔</h3><button class="close" data-close="entrySheet">×</button></div><div class="segment" id="typeSegment"><button class="active" data-type="expense">支出</button><button data-type="save">存钱</button><button data-type="income">收入</button></div><div class="fields"><div class="field"><label>日期</label><input id="txDate" type="date"></div><div class="field"><label>金额</label><input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00"></div><div class="field"><label>分类 / 存钱罐</label><select id="category"></select></div><div class="field"><label>备注</label><input id="txnote" maxlength="30" placeholder="午饭 / 工资 / 旅行基金"></div></div><button class="primary" id="saveEntry">记好啦</button></div></div>
<div class="cheer" id="cheer"><div class="cheerCard"><div class="cheerEmoji" id="cheerEmoji">🩷</div><h3>记账成功！</h3><p id="cheerText"></p><button id="closeCheer">收下老公的亲亲</button></div></div>
<script>
const $=s=>document.querySelector(s),K='wife-money-home-v2',clone=o=>JSON.parse(JSON.stringify(o)),money=n=>'¥'+Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:2}),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const localDate=()=>{const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`},currentMonth=()=>localDate().slice(0,7);
const DEF={months:{},jars:[{id:'longterm',name:'长期储蓄',emoji:'🏦',target:3000,c:'#f8d6e3'},{id:'travel',name:'旅行基金',emoji:'✈️',target:5000,c:'#e8ddff'},{id:'wish',name:'心愿基金',emoji:'🎀',target:2000,c:'#ffe4cf'},{id:'emergency',name:'应急备用',emoji:'🧸',target:3000,c:'#dff2e6'}],tx:[]};
let data=(()=>{try{return JSON.parse(localStorage.getItem(K))||clone(DEF)}catch(e){return clone(DEF)}})();if(!data.months)data.months={};if(!data.jars)data.jars=clone(DEF.jars);if(!data.tx)data.tx=[];let month=currentMonth(),txType='expense';
function save(){localStorage.setItem(K,JSON.stringify(data))}function cfg(){return data.months[month]||(data.months[month]={limit:0,goal:0,note:''})}function txDate(t){if(t.date)return t.date;if(t.at){const d=new Date(t.at);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}return (t.month||month)+'-01'}function txMonth(t){return t.month||txDate(t).slice(0,7)}function monthTx(){return data.tx.filter(t=>txMonth(t)===month)}function stats(){const x=monthTx();return{expense:x.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0),income:x.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0),saved:x.filter(t=>t.type==='save').reduce((s,t)=>s+Number(t.amount),0)}}function jarSaved(id){return data.tx.filter(t=>t.type==='save'&&t.category===id).reduce((s,t)=>s+Number(t.amount),0)}function openSheet(id){$('#'+id).classList.add('show')}function closeSheet(id){$('#'+id).classList.remove('show')}document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeSheet(b.dataset.close));document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{if(e.target===s)closeSheet(s.id)}));
function render(){const c=cfg(),s=stats();$('#month').value=month;$('#goal').value=c.goal||'';$('#limit').value=c.limit||'';$('#monthNote').value=c.note||'';$('#mSaved').textContent=money(s.saved);$('#mExpense').textContent=money(s.expense);$('#saveSmall').textContent='目标 '+money(c.goal);$('#spendSmall').textContent='上限 '+money(c.limit);$('#monthIncome').textContent='本月收入 '+money(s.income);const sr=c.goal>0?s.saved/c.goal*100:0,er=c.limit>0?s.expense/c.limit*100:0;$('#saveBar').style.width=Math.min(sr,100)+'%';$('#spendBar').style.width=Math.min(er,100)+'%';if(Number(c.goal)>0||Number(c.limit)>0){$('#goalHeadline').textContent=`存 ${money(c.goal)} · 花不超 ${money(c.limit)}`;$('#goalNote').textContent=c.note||`已经存下 ${money(s.saved)}，还能安心花 ${money(Math.max(0,Number(c.limit||0)-s.expense))}。`}else{$('#goalHeadline').textContent='还没设目标～';$('#goalNote').textContent='点右上角 ＋ 给这个月定一个舒服的目标。'}renderCats();renderJars();renderDays();renderAward();save()}
function renderCats(){let opts;if(txType==='expense')opts=['餐饮','交通','购物','娱乐','生活','其他'].map(x=>[x,x]);else if(txType==='income')opts=['工资','奖金','退款','其他收入'].map(x=>[x,x]);else opts=data.jars.map(j=>[j.id,j.emoji+' '+j.name]);$('#category').innerHTML=opts.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}
function renderJars(){const b=$('#jarlist');if(!data.jars.length){b.innerHTML='<div class="empty">还没有存钱罐～点右上角新建一个吧。</div>';return}b.innerHTML=data.jars.map(j=>{const a=jarSaved(j.id),r=j.target>0?a/j.target*100:0;return `<details><summary class="jarSummary"><div class="jarEmoji">${esc(j.emoji||'🐷')}</div><div><div class="jarName">${esc(j.name)}</div><div class="jarSub">${money(a)} / ${money(j.target)}<div class="jarMiniBar"><i style="width:${Math.min(r,100)}%"></i></div></div></div><div class="jarAmount">${Math.round(r)}% <span class="chev">⌄</span></div></summary><div class="detailBody"><div class="detailRow"><span>已经存下</span><b>${money(a)}</b></div><div class="detailRow"><span>目标</span><b>${money(j.target)}</b></div><button class="dangerLink" onclick="removeJar('${j.id}')">删除这个存钱罐</button></div></details>`}).join('')}
function renderDays(){const b=$('#daylist'),x=monthTx().slice().sort((a,b)=>txDate(b).localeCompare(txDate(a))||(b.at||0)-(a.at||0));if(!x.length){b.innerHTML='<div class="empty">这个月还没有流水～点中间的「＋ 记一笔」开始。</div>';return}const groups={};x.forEach(t=>(groups[txDate(t)]??=[]).push(t));b.innerHTML=Object.entries(groups).map(([date,items],idx)=>{const spent=items.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0),saved=items.filter(t=>t.type==='save').reduce((s,t)=>s+Number(t.amount),0),label=new Date(date+'T12:00:00').toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'}),rows=items.map(t=>{const icon=t.type==='expense'?'🧾':t.type==='income'?'💰':'🐷',sign=t.type==='expense'?'-':'+',cat=t.type==='save'?(data.jars.find(j=>j.id===t.category)?.name||'存钱'):t.category;return `<div class="tx"><div class="txIcon">${icon}</div><div><div class="txTitle">${esc(t.note||cat||'未备注')}</div><div class="txMeta">${esc(cat||'')}</div></div><div><div class="txAmt ${t.type}">${sign}${money(t.amount)}</div><button class="dangerLink" style="font-size:10px" onclick="removeTx('${t.id}')">删除</button></div></div>`}).join('');return `<details ${idx===0?'open':''}><summary class="daySummary"><div>📆</div><div><div class="dayDate">${label}</div><div class="daySub">支出 ${money(spent)} · 存下 ${money(saved)}</div></div><div class="dayAmount">${items.length} 笔 <span class="chev">⌄</span></div></summary><div class="detailBody">${rows}</div></details>`}).join('')}
function awardState(){const c=cfg(),s=stats(),ready=Number(c.goal)>0&&Number(c.limit)>0;return{c,s,ok:ready&&s.saved>=Number(c.goal)&&s.expense<=Number(c.limit)}}function renderAward(){const{c,s,ok}=awardState(),btn=$('#awardBtn');if(ok){btn.textContent='已解锁';btn.classList.add('ok');$('#awardHint').textContent='老婆完成这个月的约定啦！';$('#awardText').textContent=`这个月成功存下 ${money(s.saved)}，同时把支出控制在 ${money(s.expense)}。认真对待每一笔钱，也认真照顾未来的自己。老公郑重给老婆颁奖！`}else{btn.textContent='未解锁';btn.classList.remove('ok');if(!Number(c.goal)||!Number(c.limit))$('#awardHint').textContent='先设置本月目标';else if(s.saved<Number(c.goal))$('#awardHint').textContent='还差 '+money(Number(c.goal)-s.saved)+' 达成存钱目标';else $('#awardHint').textContent='本月支出要守住上限哦'}}
$('#awardBtn').onclick=()=>{const a=awardState();if(a.ok)$('#certificate').classList.toggle('show')};$('#openGoal').onclick=()=>openSheet('goalSheet');$('#openEntry').onclick=()=>{txType='expense';setType('expense');$('#txDate').value=localDate();$('#amount').value='';$('#txnote').value='';openSheet('entrySheet')};$('#month').onchange=e=>{month=e.target.value;render()};$('#saveGoal').onclick=()=>{const c=cfg();c.goal=Math.max(0,Number($('#goal').value||0));c.limit=Math.max(0,Number($('#limit').value||0));c.note=$('#monthNote').value.trim();save();render();closeSheet('goalSheet')};function setType(t){txType=t;document.querySelectorAll('#typeSegment button').forEach(b=>b.classList.toggle('active',b.dataset.type===t));renderCats()}document.querySelectorAll('#typeSegment button').forEach(b=>b.onclick=()=>setType(b.dataset.type));
const cheers={expense:[['🩷','记好啦老婆！花出去的钱也被你好好看见了，老公给你盖一个“认真生活”的小印章！'],['🤲🏻','这一笔收好啦～会记账不是不许自己花，是让老婆花得更安心。老公亲一口！'],['🥹','老婆今天也有在照顾自己的钱钱！一笔一笔记下来，已经很棒啦。']],save:[['🐷','叮！老婆又把一小块未来抱进存钱罐里啦！！老公现在想给你敲锣庆祝！'],['🏆','这一笔是老婆偷偷给未来的自己塞的小礼物！老公看见啦，特别特别想夸你！'],['🩷','存进去惹！！老婆每存下一笔，离月底的大奖状就更近一点点～mua！']],income:[['💰','收到钱钱啦！老婆辛苦赚来的每一块都值得被认真记住，老公给你亲一大口！'],['✨','收入到账、记账完成！老婆努力换来的钱钱已经被好好接住啦！'],['🫶🏻','这笔收入老公帮你记在小窝里啦～辛苦老婆赚钱养自己的生活，抱一下！']]};function cheer(type){const arr=cheers[type],pick=arr[Math.floor(Math.random()*arr.length)];$('#cheerEmoji').textContent=pick[0];$('#cheerText').textContent=pick[1];$('#cheer').classList.add('show')}$('#closeCheer').onclick=()=>$('#cheer').classList.remove('show');$('#cheer').addEventListener('click',e=>{if(e.target===$('#cheer'))$('#cheer').classList.remove('show')});
$('#saveEntry').onclick=()=>{const amount=Number($('#amount').value||0),date=$('#txDate').value,category=$('#category').value,note=$('#txnote').value.trim();if(!date)return alert('先选日期哦～');if(amount<=0)return alert('金额要大于 0 哦～');if(txType==='save'&&!category)return alert('先新建一个存钱罐哦～');const at=new Date(date+'T12:00:00').getTime();data.tx.push({id:uid(),month:date.slice(0,7),date,type:txType,amount,category,note,at});save();render();closeSheet('entrySheet');cheer(txType)};
$('#addJar').onclick=()=>{const name=prompt('存钱类型叫什么？例如：旅行基金');if(!name)return;const target=Math.max(0,Number(prompt('目标金额是多少？','1000')||0)),emoji=prompt('给它一个小图标～','🐷')||'🐷',colors=['#f8d6e3','#e8ddff','#ffe4cf','#dff2e6','#fff0bf'];data.jars.push({id:uid(),name:name.trim().slice(0,12),emoji:emoji.slice(0,4),target,c:colors[data.jars.length%colors.length]});save();render()};window.removeTx=id=>{if(confirm('删除这笔记录吗？')){data.tx=data.tx.filter(t=>t.id!==id);save();render()}};window.removeJar=id=>{if(data.tx.some(t=>t.type==='save'&&t.category===id))return alert('这个存钱罐已经有存钱记录啦，先别删它～');if(confirm('删除这个存钱罐吗？')){data.jars=data.jars.filter(j=>j.id!==id);save();render()}};
$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='老婆的钱钱小窝-'+localDate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)};$('#importFile').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader;r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.months||!d.tx||!d.jars)throw 0;data=d;save();render();alert('备份导入成功！')}catch(_){alert('这个备份文件好像不对哦～')}};r.readAsText(f)};$('#txDate').value=localDate();render();
</script>
